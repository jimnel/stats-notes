name: Build and deploy book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Site is served from https://<user>.github.io/<repo>/
      BASE_URL: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check every notebook is in the table of contents
        run: |
          for f in notebooks/*.ipynb; do
            if ! grep -qF "file: $f" myst.yml; then
              echo "::error file=$f::$f is not listed in the toc in myst.yml"
              missing=1
            fi
          done
          exit ${missing:-0}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute notebooks and build HTML
        run: jupyter book build --html --execute --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
